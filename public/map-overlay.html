<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeTruck Map Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --map-size: 420px;
      --map-padding-x: 70px;
      --map-padding-y: 62px;
      --map-scale: 2;
      --map-offset-x: -110px;
      --map-offset-y: -65px;
      --map-radius: 50%;
      --map-border-color: rgba(245, 197, 24, 0.96);
      --map-glow-color: rgba(245, 197, 24, 0.52);
      --map-inner-ring: rgba(10, 10, 10, 0.82);
      --map-bg: rgba(10, 10, 10, 0.64);
      --map-fade-ms: 180ms;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: var(--map-padding-y) var(--map-padding-x);
      pointer-events: none;
    }

    .map-root {
      display: block;
      width: var(--map-size);
      height: var(--map-size);
      border-radius: var(--map-radius);
      overflow: visible;
      border: 4px solid var(--map-border-color);
      box-shadow:
        0 0 0 9px var(--map-inner-ring) inset,
        0 0 0 1px rgba(255, 255, 255, 0.28),
        0 0 34px var(--map-glow-color),
        0 24px 48px rgba(0, 0, 0, 0.52);
      background: var(--map-bg);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      transition:
        opacity var(--map-fade-ms) ease,
        transform var(--map-fade-ms) ease,
        visibility 0s linear var(--map-fade-ms);
    }

    .map-root.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition:
        opacity var(--map-fade-ms) ease,
        transform var(--map-fade-ms) ease;
    }

    .map-chrome {
      position: absolute;
      inset: -18px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 5;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 0 0 3px rgba(10, 10, 10, 0.55) inset,
        0 12px 26px rgba(0, 0, 0, 0.46),
        0 0 20px rgba(245, 197, 24, 0.22);
      background:
        radial-gradient(circle at 24% 20%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 42%),
        radial-gradient(circle at 78% 76%, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 44%);
      opacity: 0.95;
    }

    .map-chrome::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.32) inset,
        0 0 22px var(--map-glow-color);
    }

    .map-chrome::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.24);
      opacity: 0.72;
    }

    .map-frame-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--map-radius);
      overflow: hidden;
      background: var(--map-bg);
    }

    .map-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: translate(var(--map-offset-x), var(--map-offset-y)) scale(var(--map-scale));
      transform-origin: top left;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .map-root.debug::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--map-radius);
      pointer-events: none;
      z-index: 6;
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(255, 255, 255, 0.35) calc(50% - 1px), rgba(255, 255, 255, 0.35) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), rgba(255, 255, 255, 0.35) calc(50% - 1px), rgba(255, 255, 255, 0.35) calc(50% + 1px), transparent calc(50% + 1px));
    }

    .map-badge {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 7;
      font: 700 12px/1.1 "Segoe UI", "Trebuchet MS", Arial, sans-serif;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(16, 16, 16, 0.72);
      border: 1px solid var(--map-border-color);
      border-radius: 999px;
      padding: 4px 8px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
    }

    .map-root.mock .map-badge {
      opacity: 1;
    }

  </style>
</head>
<body>
  <div class="map-root" id="map-root">
    <div class="map-chrome" aria-hidden="true"></div>
    <div class="map-badge" aria-hidden="true">MOCK</div>
    <div class="map-frame-wrap">
      <iframe class="map-frame" id="map-frame" title="Map overlay" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

  <script>
    const API = '/api';
    const STATE_INTERVAL = 5000;
    const MAP_BASE_URL = 'https://overlays.rtirl.com/generic.html';
    const MOCK_SRC_ID = 'mock://map';
    const query = new URLSearchParams(window.location.search);

    function parseBoolParam(name, fallback = false) {
      const raw = String(query.get(name) || '').trim().toLowerCase();
      if (!raw) return fallback;
      return raw === '1' || raw === 'true' || raw === 'yes' || raw === 'on';
    }

    function parseFiniteParam(name, fallback = null) {
      const raw = String(query.get(name) || '').trim();
      if (!raw) return fallback;
      const num = Number(raw);
      return Number.isFinite(num) ? num : fallback;
    }

    function setRootVar(name, value) {
      if (value == null) return;
      document.documentElement.style.setProperty(name, String(value));
    }

    const MOCK_MODE = parseBoolParam('mock', false);
    const FORCE_VISIBLE = parseBoolParam('force', MOCK_MODE);
    const DEBUG_MODE = parseBoolParam('debug', MOCK_MODE);
    const KEY_OVERRIDE = String(query.get('key') || '').trim();
    const ZOOM_OVERRIDE = String(query.get('zoom') || '').trim() || '13';
    const MOCK_PRESET = String(query.get('preset') || 'city').trim().toLowerCase();
    const MOCK_SPEED_SEC = (() => {
      const value = parseFiniteParam('speed', 10);
      const safe = Number.isFinite(value) && value > 0 ? value : 10;
      return Math.max(2, Math.min(60, safe));
    })();

    let showMapOverlay = false;
    let currentKey = '';
    let currentSrc = '';
    let clearTimer = null;

    setRootVar('--map-scale', parseFiniteParam('scale', null));
    setRootVar('--map-offset-x', (() => {
      const value = parseFiniteParam('offsetX', null);
      return value == null ? null : `${value}px`;
    })());
    setRootVar('--map-offset-y', (() => {
      const value = parseFiniteParam('offsetY', null);
      return value == null ? null : `${value}px`;
    })());
    setRootVar('--map-size', (() => {
      const value = parseFiniteParam('size', null);
      return value == null ? null : `${value}px`;
    })());
    setRootVar('--map-padding-x', (() => {
      const value = parseFiniteParam('padX', null);
      return value == null ? null : `${value}px`;
    })());
    setRootVar('--map-padding-y', (() => {
      const value = parseFiniteParam('padY', null);
      return value == null ? null : `${value}px`;
    })());

    function buildMapSrc(key) {
      const params = new URLSearchParams({
        key,
        zoom: ZOOM_OVERRIDE
      });
      return `${MAP_BASE_URL}?${params.toString()}`;
    }

    function buildMockMapSrcDoc() {
      const presets = {
        city: {
          label: 'Istanbul / City',
          routeTop: '58%',
          routeRotate: '-22deg',
          start: { x: 18, y: 68 },
          mid: { x: 55, y: 50 },
          end: { x: 84, y: 34 }
        },
        highway: {
          label: 'Ankara / Highway',
          routeTop: '52%',
          routeRotate: '-10deg',
          start: { x: 10, y: 56 },
          mid: { x: 52, y: 52 },
          end: { x: 92, y: 48 }
        },
        coast: {
          label: 'Izmir / Coast',
          routeTop: '62%',
          routeRotate: '-30deg',
          start: { x: 16, y: 74 },
          mid: { x: 48, y: 56 },
          end: { x: 82, y: 36 }
        }
      };
      const preset = presets[MOCK_PRESET] || presets.city;

      return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101214; }
  body {
    background:
      radial-gradient(circle at 65% 28%, rgba(245,197,24,0.20), rgba(245,197,24,0) 34%),
      linear-gradient(180deg, #1b1f23 0%, #12161a 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 30px);
    opacity: 0.42;
  }
  .route {
    position: absolute; left: 10%; top: ${preset.routeTop}; width: 80%; height: 16px;
    border-radius: 999px;
    transform: rotate(${preset.routeRotate});
    background: linear-gradient(90deg, rgba(245,197,24,0.25), rgba(245,197,24,0.9), rgba(245,197,24,0.28));
    box-shadow: 0 0 14px rgba(245,197,24,0.36);
  }
  .marker {
    position: absolute;
    left: ${preset.start.x}%;
    top: ${preset.start.y}%;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: #ffd966;
    border: 2px solid rgba(0,0,0,0.45);
    box-shadow: 0 0 0 8px rgba(255,217,102,0.14), 0 0 18px rgba(255,217,102,0.6);
    animation: drift ${MOCK_SPEED_SEC}s linear infinite, pulse 1.6s ease-in-out infinite;
  }
  .label {
    position: absolute;
    left: 12px;
    bottom: 12px;
    color: rgba(255,255,255,0.9);
    font: 600 12px/1.2 sans-serif;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.16); opacity: 0.85; }
  }
  @keyframes drift {
    0% { left: ${preset.start.x}%; top: ${preset.start.y}%; }
    50% { left: ${preset.mid.x}%; top: ${preset.mid.y}%; }
    100% { left: ${preset.end.x}%; top: ${preset.end.y}%; }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="route"></div>
  <div class="marker"></div>
  <div class="label">Mock: ${preset.label}</div>
</body>
</html>`;
    }

    function applyMockMap() {
      cancelScheduledClear();
      const frame = document.getElementById('map-frame');
      if (currentSrc === MOCK_SRC_ID) return;
      frame.removeAttribute('src');
      frame.srcdoc = buildMockMapSrcDoc();
      currentSrc = MOCK_SRC_ID;
    }

    function clearMapNow() {
      const frame = document.getElementById('map-frame');
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
      currentSrc = '';
    }

    function cancelScheduledClear() {
      if (clearTimer != null) {
        clearTimeout(clearTimer);
        clearTimer = null;
      }
    }

    function scheduleClearMap() {
      cancelScheduledClear();
      clearTimer = setTimeout(() => {
        clearTimer = null;
        if (!showMapOverlay) {
          clearMapNow();
        }
      }, 420);
    }

    function applyVisibility() {
      const root = document.getElementById('map-root');
      root.classList.toggle('visible', showMapOverlay);
      root.classList.toggle('mock', MOCK_MODE);
      root.classList.toggle('debug', DEBUG_MODE);
      if (!showMapOverlay) {
        scheduleClearMap();
      } else {
        cancelScheduledClear();
      }
    }

    async function syncState() {
      try {
        const response = await fetch(`${API}/state`);
        const state = await response.json();

        const nextVisible = FORCE_VISIBLE ? true : Boolean(state.show_map_overlay);
        const nextKey = (state.rtirl_key || '').trim();

        showMapOverlay = nextVisible;
        applyVisibility();

        if (!showMapOverlay) return;

        if (MOCK_MODE) {
          applyMockMap();
          return;
        }

        const effectiveKey = KEY_OVERRIDE || nextKey;
        if (!effectiveKey) {
          currentKey = '';
          clearMapNow();
          return;
        }

        const nextSrc = buildMapSrc(effectiveKey);
        if (nextSrc !== currentSrc || effectiveKey !== currentKey) {
          cancelScheduledClear();
          currentKey = effectiveKey;
          currentSrc = nextSrc;
          document.getElementById('map-frame').removeAttribute('srcdoc');
          document.getElementById('map-frame').src = nextSrc;
        }
      } catch {
        if (!showMapOverlay) {
          scheduleClearMap();
        }
      }
    }

    if (FORCE_VISIBLE) {
      showMapOverlay = true;
      applyVisibility();
      if (MOCK_MODE) applyMockMap();
    }

    applyVisibility();
    syncState();
    setInterval(syncState, STATE_INTERVAL);
  </script>
</body>
</html>
